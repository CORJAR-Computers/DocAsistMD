<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocAsistMD - Gestion de Consultorio Medico</title>
    <script>
      // Anti-FOUC: aplica el tema guardado antes del primer paint.
      // La clave debe coincidir con THEME_STORAGE_KEY en src/stores/uiStore.ts.
      (function () {
        try {
          var stored = localStorage.getItem("docasistmd-theme");
          var mode = stored === "light" || stored === "dark" ? stored : "auto";
          document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "auto");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
